[tools]
watchexec = "latest"

[tasks.run]
description = "Run the game"
run = "dotnet clean && dotnet build && bin\\Godot_v4.5.2-stable_mono_win64\\Godot_v4.5.2-stable_mono_win64.exe --path ."

[tasks.watch]
description = "Relaunch the game on source file changes (uses watchexec)"
run = "watchexec --restart --exts gd,gdshader,tscn,tres -- bin\\Godot_v4.5.2-stable_mono_win64\\Godot_v4.5.2-stable_mono_win64.exe --path ."

[tasks.screenshot]
description = "Render one frame, save screenshot.png, quit"
run = "bin\\Godot_v4.5.2-stable_mono_win64\\Godot_v4.5.2-stable_mono_win64.exe --path . -- --screenshot"

[tasks.check]
description = "Verify the project boots headlessly (exit code 0 = clean)"
run = "bin\\Godot_v4.5.2-stable_mono_win64\\Godot_v4.5.2-stable_mono_win64.exe --path . --headless --quit"

[tasks.test]
description = "Run C# xUnit unit tests"
run = "dotnet test tests/unit/pan_for_gold.Tests.csproj"

[tasks.itest]
description = "Run in-engine integration tests (boots Godot headless, exit 0 = pass)"
run = "dotnet build && bin\\Godot_v4.5.2-stable_mono_win64\\Godot_v4.5.2-stable_mono_win64.exe --path . --headless --quit-after 1800 -- --run-tests"

[tasks.itest-regen]
description = "Regenerate fixture snapshots from their full (player-action) setups"
run = "dotnet build && bin\\Godot_v4.5.2-stable_mono_win64\\Godot_v4.5.2-stable_mono_win64.exe --path . --headless --quit-after 1800 -- --run-tests --regen-fixtures"

[tasks.editor]
description = "Open the Godot editor"
run = "bin\\Godot_v4.5.2-stable_mono_win64\\Godot_v4.5.2-stable_mono_win64.exe --path . --editor"

[tasks.shots]
description = "Render gameplay screenshots to screenshots/<name>.png (brief windowed runs)"
run = [
  "dotnet build",
  "bin\\Godot_v4.5.2-stable_mono_win64\\Godot_v4.5.2-stable_mono_win64.exe --path . --quit-after 600 -- --shot title",
  "bin\\Godot_v4.5.2-stable_mono_win64\\Godot_v4.5.2-stable_mono_win64.exe --path . --quit-after 600 -- --shot overworld",
  "bin\\Godot_v4.5.2-stable_mono_win64\\Godot_v4.5.2-stable_mono_win64.exe --path . --quit-after 600 -- --shot unlocked",
  "bin\\Godot_v4.5.2-stable_mono_win64\\Godot_v4.5.2-stable_mono_win64.exe --path . --quit-after 600 -- --shot village",
  "bin\\Godot_v4.5.2-stable_mono_win64\\Godot_v4.5.2-stable_mono_win64.exe --path . --quit-after 600 -- --shot hover",
]
